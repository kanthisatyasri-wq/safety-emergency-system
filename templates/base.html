<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Safety & Emergency System
        {% endblock %}
    </title>

    <style>
        /* GLOBAL STYLES */

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }

        a {
            transition: color 0.2s ease,
                        background 0.2s ease,
                        transform 0.2s ease;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button:focus-visible,
        a:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #67e8f9;
            outline-offset: 3px;
        }

        /* MAIN PAGE CONTAINER */

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
            flex: 1;
        }

        /* DJANGO MESSAGES */

        .message {
            padding: 15px 18px;
            margin-bottom: 18px;
            border: 1px solid #a5f3fc;
            border-left: 5px solid #0891b2;
            border-radius: 10px;
            background: #ecfeff;
            color: #155e75;
            font-size: 14px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .message.success {
            background: #ecfdf5;
            border-color: #a7f3d0;
            border-left-color: #059669;
            color: #065f46;
        }

        .message.error {
            background: #fef2f2;
            border-color: #fecaca;
            border-left-color: #dc2626;
            color: #991b1b;
        }

        .message.warning {
            background: #fffbeb;
            border-color: #fde68a;
            border-left-color: #d97706;
            color: #92400e;
        }

        /* HERO SECTION */

        .hero {
            position: relative;
            overflow: hidden;
            padding: 55px 35px;
            border-radius: 20px;
            background: linear-gradient(
                135deg,
                #0f172a 0%,
                #164e63 55%,
                #0891b2 100%
            );
            color: #ffffff;
            text-align: center;
            box-shadow: 0 12px 28px rgba(8, 145, 178, 0.16);
        }

        .hero h1 {
            margin: 0 0 18px;
            font-size: clamp(27px, 4vw, 40px);
            line-height: 1.3;
        }

        .hero p {
            max-width: 700px;
            margin: 0 auto 18px;
            color: #cffafe;
            font-size: 16px;
            line-height: 1.9;
        }

        .hero-button {
            display: inline-block;
            margin: 12px 6px 0;
            padding: 13px 23px;
            border: 1px solid #ffffff;
            border-radius: 9px;
            background: #ffffff;
            color: #164e63 !important;
            text-decoration: none;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease,
                        background 0.2s ease;
        }

        .hero-button:hover {
            transform: translateY(-2px);
            background: #cffafe;
            border-color: #cffafe;
        }

        /* DASHBOARD HEADER */

        .dashboard-header {
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background: linear-gradient(
                135deg,
                #ffffff,
                #ecfeff
            );
            box-shadow: 0 5px 18px rgba(15, 23, 42, 0.05);
        }

        .dashboard-header h1 {
            margin: 0 0 12px;
            color: #164e63;
            font-size: clamp(24px, 3vw, 32px);
        }

        .dashboard-header p {
            margin: 0;
            color: #64748b;
            font-size: 15px;
            line-height: 1.8;
        }

        /* CARD GRID */

        .cards {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(min(100%, 250px), 1fr));
            gap: 22px;
        }

        .card {
            min-width: 0;
            padding: 25px;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            background: #ffffff;
            box-shadow: 0 5px 16px rgba(15, 23, 42, 0.05);
            transition: transform 0.2s ease,
                        box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(8, 145, 178, 0.1);
        }

        .card h2,
        .card h3 {
            margin-top: 0;
            color: #164e63;
            line-height: 1.5;
        }

        .card p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .card-button {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 17px;
            border: 1px solid #0891b2;
            border-radius: 8px;
            background: #0891b2;
            color: #ffffff !important;
            text-decoration: none;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
        }

        .card-button:hover {
            background: #164e63;
            border-color: #164e63;
        }

        /* GENERAL FORM ELEMENTS */

        input,
        select,
        textarea {
            max-width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            color: #0f172a;
        }

        input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="hidden"]),
        select,
        textarea {
            padding: 11px 12px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0891b2;
            outline: 3px solid rgba(8, 145, 178, 0.12);
        }

        button[type="submit"],
        input[type="submit"] {
            cursor: pointer;
        }

        /* FOOTER */

        footer {
            margin-top: auto;
            padding: 27px 20px;
            background: linear-gradient(
                135deg,
                #0f172a,
                #164e63
            );
            color: #ffffff;
            text-align: center;
            font-size: 14px;
            line-height: 1.9;
        }

        footer small {
            color: #a5f3fc;
            font-size: 12px;
            letter-spacing: 0.4px;
        }

        /* RESPONSIVE LAYOUT */

        @media (max-width: 650px) {
            .container {
                width: 94%;
                margin: 22px auto;
            }

            .hero {
                padding: 38px 20px;
                border-radius: 15px;
            }

            .hero p {
                font-size: 14px;
            }

            .hero-button {
                display: block;
                width: 100%;
                margin: 12px 0 0;
            }

            .dashboard-header {
                padding: 22px;
            }

            .cards {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .card {
                padding: 21px;
            }

            footer {
                padding: 22px 15px;
            }
        }

        /* REDUCED MOTION ACCESSIBILITY */

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    {% include "navbar.html" %}

    <main class="container">

        {% if messages %}

            {% for message in messages %}

                <div class="message {{ message.tags }}" role="status">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

        {% block content %}
        {% endblock %}

    </main>

    <footer>
        <strong>🛡 Safety & Emergency System</strong>

        <br>

        <small>
            Stay Safe • Stay Connected
        </small>
    </footer>

</body>

</html>
